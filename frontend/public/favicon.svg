<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Binding rings -->
  <rect x="9" y="2" width="3" height="7" fill="#5A5A66"/>
  <rect x="24" y="2" width="3" height="7" fill="#5A5A66"/>
  <!-- Calendar body -->
  <rect x="3" y="6" width="30" height="28" fill="#15151A" stroke="#3A3A45" stroke-width="1"/>
  <!-- Header strip -->
  <rect x="3" y="6" width="30" height="7" fill="#FF5A4E"/>
  <!-- Q ring -->
  <circle cx="17" cy="22" r="6.5" fill="none" stroke="#0091FF" stroke-width="2"/>
  <!-- Q tail -->
  <line x1="21" y1="26" x2="27" y2="32" stroke="#0091FF" stroke-width="2" stroke-linecap="square"/>
  <!-- Today tile (amber pulse) -->
  <rect x="15.5" y="20.5" width="3" height="3" fill="#FFB400"/>
</svg>
