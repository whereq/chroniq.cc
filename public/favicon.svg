<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two binding rings at top -->
  <rect x="9" y="1" width="4" height="6" rx="2" fill="#FFB400"/>
  <rect x="19" y="1" width="4" height="6" rx="2" fill="#FFB400"/>
  <!-- Calendar body -->
  <rect x="3" y="4" width="26" height="25" rx="2" fill="#131318" stroke="#2A2A33" stroke-width="1"/>
  <!-- Red header strip -->
  <rect x="3" y="4" width="26" height="8" rx="2" fill="#FF5A4E"/>
  <rect x="3" y="8" width="26" height="4" fill="#FF5A4E"/>
  <!-- Grid of day squares -->
  <rect x="7" y="16" width="4" height="4" rx="1" fill="#2A2A33"/>
  <rect x="14" y="16" width="4" height="4" rx="1" fill="#0091FF"/>
  <rect x="21" y="16" width="4" height="4" rx="1" fill="#2A2A33"/>
  <rect x="7" y="23" width="4" height="4" rx="1" fill="#2A2A33"/>
  <rect x="14" y="23" width="4" height="4" rx="1" fill="#2A2A33"/>
  <rect x="21" y="23" width="4" height="4" rx="1" fill="#2A2A33"/>
</svg>
