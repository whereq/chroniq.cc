server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all app + public booking routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the chroniq API container.
    # IMPORTANT: use the unique container name `chroniq-api`, NOT the compose
    # service alias `api`. Every whereq app defines a service named `api` on the
    # shared whereq-network, so the alias `api` resolves to a random app's API
    # (health/ready exist everywhere, masking it — but /me/* then 404s).
    location /api/ {
        proxy_pass http://chroniq-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
